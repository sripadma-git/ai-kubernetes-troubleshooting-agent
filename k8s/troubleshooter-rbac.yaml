apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-troubleshooter
  namespace: ai-troubleshooter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-troubleshooter
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
    verbs:
      - get
      - list
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-troubleshooter
subjects:
  - kind: ServiceAccount
    name: ai-troubleshooter
    namespace: ai-troubleshooter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-troubleshooter
